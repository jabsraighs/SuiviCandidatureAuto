services:
  veille:
    build: .
    container_name: veille-emploi
    restart: unless-stopped
    ports:
      - "8080:8080"          # utilisé uniquement lors de la 1ère autorisation Gmail
    volumes:
      - ./data:/app/data     # credentials.json, token_alertes.json, offres_vues.json, nouvelles_offres.md
    environment:
      - INTERVAL_HOURS=3     # change l'intervalle entre 2 passages (en heures)